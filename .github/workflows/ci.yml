name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./apps/backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './apps/backend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Run backend tests
      run: npm test

  test-frontend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./apps/frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './apps/frontend/package-lock.json'
        
    - name: Install dependencies
      run: |
        ROLLDOWN_BINDING_VERSION="$(node -p "require('./package-lock.json').packages['node_modules/@rolldown/binding-linux-x64-gnu'].version")"
        LIGHTNINGCSS_BINDING_VERSION="$(node -p "require('./package-lock.json').packages['node_modules/lightningcss-linux-x64-gnu'].version")"
        if npm ci --include=optional; then
          :
        else
          rm -rf node_modules package-lock.json
          npm install --include=optional
        fi
        npm install --no-save --include=optional @rolldown/binding-linux-x64-gnu@"${ROLLDOWN_BINDING_VERSION}" lightningcss-linux-x64-gnu@"${LIGHTNINGCSS_BINDING_VERSION}"
        node --input-type=module -e "import('rolldown')" || {
          rm -rf node_modules package-lock.json
          npm install --include=optional
          npm install --no-save --include=optional @rolldown/binding-linux-x64-gnu@"${ROLLDOWN_BINDING_VERSION}" lightningcss-linux-x64-gnu@"${LIGHTNINGCSS_BINDING_VERSION}"
        }
      
    - name: Run frontend tests
      run: npm run test:run
      
    - name: Build frontend
      run: npm run build
